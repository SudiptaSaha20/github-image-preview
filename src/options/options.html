<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GitHub Image Preview — Settings</title>
    <link rel="stylesheet" href="../../shared/ui.css" />
    <style>
      body {
        width: auto;
        max-width: 560px;
        margin: 40px auto;
        padding: 0 16px;
      }
      h1 {
        font-size: 18px;
      }
      .ghip-card {
        border: 1px solid #30363d;
        border-radius: 10px;
        overflow: hidden;
        margin-top: 16px;
      }
      .ghip-card .ghip-row {
        padding: 12px 14px;
        border-bottom: 1px solid #30363d;
      }
      .ghip-card .ghip-row:last-child {
        border-bottom: none;
      }
      .ghip-addrow {
        display: flex;
        gap: 8px;
        margin-top: 16px;
      }
      .ghip-addrow input {
        flex: 1;
        font-family: inherit;
        font-size: 13px;
        padding: 7px 10px;
        border-radius: 6px;
        border: 1px solid #30363d;
        background: #0d1117;
        color: #e6edf3;
      }
    </style>
  </head>
  <body>
    <header style="border: none; padding: 0;">
      <img src="../../icons/icon48.png" width="24" height="24" alt="" />
      <h1 style="margin: 0;">GitHub Image Preview — Settings</h1>
    </header>

    <p class="ghip-note">
      Choose which sites the image viewer runs on. It works on
      <strong>github.com</strong> out of the box; add other domains below if
      you use a self-hosted GitHub Enterprise instance.
    </p>

    <div class="ghip-card" id="sitesList"></div>

    <div class="ghip-addrow">
      <input id="addInput" type="text" placeholder="github.mycompany.com" />
      <button id="addBtn" class="ghip-btn ghip-primary">Add site</button>
    </div>
    <p class="ghip-error" id="addError"></p>

    <script src="options.js"></script>
  </body>
</html>
